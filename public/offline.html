<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d9d8d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>オフラインです | 3M Platform</title>
    <style>
      :root {
        color: #0f172a;
        background: #f8fafc;
        font-family:
          "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: linear-gradient(180deg, #f8fafc 0%, #edf6f5 100%);
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        background: rgb(255 255 255 / 0.95);
        border: 1px solid #dbe7e5;
        border-radius: 28px;
        box-shadow: 0 18px 45px rgb(15 23 42 / 0.12);
        margin: 0 auto;
        max-width: 520px;
        padding: 32px;
        text-align: center;
      }

      img {
        height: 96px;
        margin: 0 auto 20px;
        width: 96px;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }

      p {
        color: #475569;
        line-height: 1.8;
        margin: 0;
      }

      button {
        background: #1d9d8d;
        border: 0;
        border-radius: 9999px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 24px;
        padding: 12px 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa-192.png" alt="" />
      <h1>現在オフラインです</h1>
      <p>
        地図や投稿データの更新には通信が必要です。接続が戻ったら、もう一度読み込んでください。
      </p>
      <button type="button" onclick="location.reload()">再読み込み</button>
    </main>
  </body>
</html>
